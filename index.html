<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Turístico - Calarcá 2026</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="imagenes/LOGO CALARCA 2026.jpg" alt="Logo Calarcá 2026" id="logo">
        <h1>Mapa Turístico Calarcá 2026</h1>
    </header>
    
    <div id="main-content">
        <aside id="ads-sidebar">
            <h3>Pautas Publicitarias</h3>
            <div class="ad-slot">
                <p>Publicidad 1</p>
                <!-- <img src="ruta/a/publicidad1.jpg" alt="Publicidad 1"> -->
            </div>
            <div class="ad-slot">
                <p>Publicidad 2</p>
                <!-- <img src="ruta/a/publicidad2.jpg" alt="Publicidad 2"> -->
            </div>
            <div class="info-section">
                <h3>Información Turística</h3>
                <p>Descubre los encantos de Calarcá 2026.</p>
                <div id="selected-info">
                    <p>Selecciona un punto en el mapa para ver más detalles.</p>
                </div>
            </div>
        </aside>
        
        <div id="map-container">
            <div id="map"></div>
            <div id="coords" class="coordinate-helper">Coordenadas: [0, 0]</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Calarcá - Quindío, Colombia. Todos los derechos reservados.</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="script.js"></script>
</body>
</html>
